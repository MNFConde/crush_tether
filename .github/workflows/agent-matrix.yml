# M7.3 agent 兼容矩阵 CI（测试方法与三层触发的定稿见 doc/test-and-ci.md §1；
# 测试结果在 doc/agent-compat-matrix.md）
#
# 正向断言：headless（claude -p / crush run / zcode -p）+ 本地 mock LLM 驱动一轮
# tool_use，五 job 全部串联真引擎——探针 bash 角色转发 `crush-tether hook`（claude/
# crush）或正式插件直挂引擎（zcode），断言 `.crush-tether/decisions.jsonl` 落 allow
# 裁决 = 「hook 被拉起 + 引擎裁决 + agent 采纳」全链。零凭证零费用（mock 后端），
# 行为确定（DISABLE_GROWTHBOOK=1 钉死 claude 灰度态；crush 无灰度机制）。
#
# 层次：
# - push/PR：pinned 版本 smoke，paths 过滤 agent 耦合面；红灯归因「我方破坏」
# - weekly cron：latest 版本 smoke——上游破坏性变更的哨兵（红灯 = 上游信号）
# - workflow_dispatch：手动指定版本回溯/排查
#
# runner 矩阵：ubuntu 双 job（claude/crush）+ windows 三 job（claude/crush/zcode）。
# zcode 仅 windows：App 内嵌 CLI（zcode.cjs）为 win32-x64 bundle，从 extras bucket
# manifest 解析版本 + CDN 直链下载，7z 两步解包取 cjs（不装 App，headless 只需 node +
# cjs）；Linux 版内测中，公测后补 ubuntu job。zcode hook 走插件轨（config 轨信任门
# headless 不可首授）：插件无人值守装配 = known_marketplaces/installed_plugins/
# cache 拷贝 + enabledPlugins 置真（2026-09-10 本机 spike 验证：机械重建即被识别，
# 无 transaction/digest 校验障碍），断言 = decisions.jsonl 落 allow 裁决。
# 版本 bump 人工主导：改下方 env 三个 pinned 值。
# agent 侧 Windows 差异（claude 可能提供 PowerShell 工具）已由 mock 自适应 +
# matcher "Bash|PowerShell" 兜住。

name: agent-matrix

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "plugin/**"
      - "script/hook_probe.py"
      - "script/mock_llm.py"
      - ".github/workflows/agent-matrix.yml"
  pull_request:
    paths:
      - "src/**"
      - "plugin/**"
      - "script/hook_probe.py"
      - "script/mock_llm.py"
      - ".github/workflows/agent-matrix.yml"
  workflow_dispatch:
    inputs:
      claude_version:
        description: "claude-code version (npm spec, e.g. 2.1.263 / latest)"
        required: false
      crush_version:
        description: "crush version without v prefix (e.g. 0.92.0 / latest)"
        required: false
      zcode_version:
        description: "zcode version (e.g. 3.11.2 / latest = extras bucket 当前版)"
        required: false
  schedule:
    - cron: "23 3 * * 1" # 每周一 UTC：latest 版本 smoke（上游哨兵）

concurrency:
  group: agent-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_VERSION_PINNED: "2.1.263"
  CRUSH_VERSION_PINNED: "0.92.0"
  ZCODE_VERSION_PINNED: "3.11.2"
  MOCK_PORT: "8787"

jobs:
  claude-code:
    name: claude-code headless hook smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Resolve claude version spec
        id: ver
        run: |
          spec="${{ inputs.claude_version }}"
          if [ -z "$spec" ]; then spec="${CLAUDE_VERSION_PINNED}"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then spec="latest"; fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install claude-code@${{ steps.ver.outputs.spec }}
        run: npm install -g "@anthropic-ai/claude-code@${{ steps.ver.outputs.spec }}"

      - name: Install engine (crush-tether) to PATH
        run: cargo install --path . --locked

      - name: Wrapper guard unit check (sh, M8.2)
        run: |
          cd plugin/crush-tether/bin
          # present: forward (check mode, empty stdin -> silent exit 0)
          ./crush-tether-wrapper.sh </dev/null
          # absent: empty PATH -> exit 2 + guidance (failure mode #2 loud failure)
          set +e
          out=$(env PATH="" ./crush-tether-wrapper.sh </dev/null 2>&1)
          code=$?
          set -e
          test "$code" -eq 2
          echo "$out" | grep -q "binary not found"

      - name: Start mock LLM backend
        run: |
          python3 script/mock_llm.py --log "$PWD/mock-requests.jsonl" &
          for i in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/${MOCK_PORT}) 2>/dev/null; then exit 0; fi
            sleep 0.5
          done
          exit 1

      - name: Register probe hooks via settings file
        run: |
          mkdir -p .hook-probe
          cat > ci-settings.json <<EOF
          {
            "env": {
              "ANTHROPIC_BASE_URL": "http://127.0.0.1:${MOCK_PORT}",
              "ANTHROPIC_AUTH_TOKEN": "dummy-matrix",
              "ANTHROPIC_API_KEY": "dummy-matrix",
              "ANTHROPIC_MODEL": "claude-sonnet-4-5"
            },
            "hooks": {
              "PreToolUse": [
                { "matcher": "Bash|PowerShell",
                  "hooks": [{ "type": "command",
                    "command": "python3 $PWD/script/hook_probe.py bash --agent claudecode --source ci --probe-dir $PWD/.hook-probe",
                    "timeout": 30 }] }
              ],
              "PostToolUse": [
                { "matcher": "Bash|PowerShell",
                  "hooks": [{ "type": "command",
                    "command": "python3 $PWD/script/hook_probe.py post --agent claudecode --source ci --probe-dir $PWD/.hook-probe",
                    "timeout": 30 }] }
              ]
            }
          }
          EOF

      - name: Headless run (mock-driven turn)
        run: |
          DISABLE_GROWTHBOOK=1 claude -p "请运行命令: echo agent-matrix-smoke" \
            --settings ci-settings.json

      - name: Assert engine decision logged (positive sentinel)
        run: |
          lines=$(wc -l < .hook-probe/dump.jsonl)
          echo "probe dump lines: $lines"
          test "$lines" -ge 1
          grep -q 'tool_name' .hook-probe/dump.jsonl
          test -f .crush-tether/decisions.jsonl
          grep -q '"command":"echo mock-hook-test"' .crush-tether/decisions.jsonl
          grep -q '"decision":"allow"' .crush-tether/decisions.jsonl

      - name: Scenario suite (deny / fail-open / updated_input)
        run: |
          python3 script/mock_llm.py --port 8788 --cmd "echo mock-hook-test > ci-exec.txt" \
            --log scenario-requests.jsonl &
          for i in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/8788) 2>/dev/null; then break; fi
            sleep 0.5
          done
          ws="$PWD"
          cat > ci-scenario-settings.json <<EOF
          {
            "env": {
              "ANTHROPIC_BASE_URL": "http://127.0.0.1:8788",
              "ANTHROPIC_AUTH_TOKEN": "dummy-matrix",
              "ANTHROPIC_API_KEY": "dummy-matrix",
              "ANTHROPIC_MODEL": "claude-sonnet-4-5"
            },
            "hooks": {
              "PreToolUse": [
                { "matcher": "Bash|PowerShell",
                  "hooks": [{ "type": "command",
                    "command": "python3 $ws/script/hook_probe.py perm --agent claudecode --source ci --probe-dir $ws/.hook-probe",
                    "timeout": 30 }] }
              ]
            }
          }
          EOF
          for s in deny failopen rewrite; do
            bash script/ci_scenario.sh setup "$s" "$ws/.hook-probe" claudecode "$ws"
            DISABLE_GROWTHBOOK=1 claude -p "请运行命令: echo agent-matrix-smoke" \
              --settings ci-scenario-settings.json
            bash script/ci_scenario.sh assert "$s" "$ws/.hook-probe" claudecode "$ws"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-code-probe-dump
          path: |
            .hook-probe/dump.jsonl
            .crush-tether/decisions.jsonl
            mock-requests.jsonl
            scenario-requests.jsonl
          if-no-files-found: warn

  crush:
    name: crush headless hook smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Resolve crush version
        id: ver
        run: |
          ver="${{ inputs.crush_version }}"
          if [ -z "$ver" ]; then ver="${CRUSH_VERSION_PINNED}"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ver=$(curl -fsSL https://api.github.com/repos/charmbracelet/crush/releases/latest \
              | grep -o '"tag_name": "v[^"]*"' | head -1 | cut -d'"' -f4 | sed 's/^v//')
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Install crush ${{ steps.ver.outputs.ver }}
        run: |
          v="${{ steps.ver.outputs.ver }}"
          rm -rf /tmp/crush-pkg && mkdir -p /tmp/crush-pkg
          curl -fsSL -o /tmp/crush.tar.gz \
            "https://github.com/charmbracelet/crush/releases/download/v${v}/crush_${v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/crush.tar.gz -C /tmp/crush-pkg
          bin=$(find /tmp/crush-pkg -type f -name crush | head -1)
          test -n "$bin"
          sudo install "$bin" /usr/local/bin/crush
          crush --version

      - name: Install engine (crush-tether) to PATH
        run: cargo install --path . --locked

      - name: Start mock LLM backend
        run: |
          python3 script/mock_llm.py --log "$PWD/mock-requests.jsonl" &
          for i in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/${MOCK_PORT}) 2>/dev/null; then exit 0; fi
            sleep 0.5
          done
          exit 1

      - name: Register probe hooks via project crush.json
        run: |
          mkdir -p .hook-probe
          cat > crush.json <<EOF
          {
            "providers": {
              "mockspike": {
                "type": "openai-compat",
                "base_url": "http://127.0.0.1:${MOCK_PORT}/v1",
                "api_key": "dummy-matrix",
                "models": [{"id": "mock-model", "name": "Mock Matrix Model",
                            "context_window": 128000}]
              }
            },
            "hooks": {
              "PreToolUse": [
                { "name": "hook-probe",
                  "command": "python3 $PWD/script/hook_probe.py bash --agent crush --source ci --probe-dir $PWD/.hook-probe",
                  "timeout": 30 }
              ]
            }
          }
          EOF

      - name: Headless run (mock-driven turn)
        run: crush run -m mockspike/mock-model "agent-matrix smoke"

      - name: Assert engine decision logged (positive sentinel)
        run: |
          lines=$(wc -l < .hook-probe/dump.jsonl)
          echo "probe dump lines: $lines"
          test "$lines" -ge 1
          test -f .crush-tether/decisions.jsonl
          grep -q '"command":"echo mock-hook-test"' .crush-tether/decisions.jsonl
          grep -q '"decision":"allow"' .crush-tether/decisions.jsonl

      - name: Scenario suite (deny / fail-open / updated_input)
        run: |
          python3 script/mock_llm.py --port 8788 --cmd "echo mock-hook-test > ci-exec.txt" \
            --log scenario-requests.jsonl &
          for i in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/8788) 2>/dev/null; then break; fi
            sleep 0.5
          done
          ws="$PWD"
          cat > crush.json <<EOF
          {
            "providers": {
              "mockspike": {
                "type": "openai-compat",
                "base_url": "http://127.0.0.1:8788/v1",
                "api_key": "dummy-matrix",
                "models": [{"id": "mock-model", "name": "Mock Matrix Model",
                            "context_window": 128000}]
              }
            },
            "hooks": {
              "PreToolUse": [
                { "name": "hook-probe",
                  "command": "python3 $ws/script/hook_probe.py perm --agent crush --source ci --probe-dir $ws/.hook-probe",
                  "timeout": 30 }
              ]
            }
          }
          EOF
          for s in deny failopen rewrite; do
            bash script/ci_scenario.sh setup "$s" "$ws/.hook-probe" crush "$ws"
            crush run -m mockspike/mock-model "agent-matrix scenario"
            bash script/ci_scenario.sh assert "$s" "$ws/.hook-probe" crush "$ws"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crush-probe-dump
          path: |
            .hook-probe/dump.jsonl
            .crush-tether/decisions.jsonl
            mock-requests.jsonl
            scenario-requests.jsonl
          if-no-files-found: warn

  claude-code-windows:
    name: claude-code headless hook smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Resolve claude version spec
        id: ver
        run: |
          spec="${{ inputs.claude_version }}"
          if [ -z "$spec" ]; then spec="${CLAUDE_VERSION_PINNED}"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then spec="latest"; fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install claude-code@${{ steps.ver.outputs.spec }}
        run: npm install -g "@anthropic-ai/claude-code@${{ steps.ver.outputs.spec }}"

      - name: Install engine (crush-tether) to PATH
        run: cargo install --path . --locked

      - name: Start mock LLM backend
        run: |
          python script/mock_llm.py --log mock-requests.jsonl &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null "http://127.0.0.1:${MOCK_PORT}/"; then exit 0; fi
            sleep 0.5
          done
          exit 1

      - name: Register probe hooks via settings file
        run: |
          mkdir -p .hook-probe
          ws="$(cygpath -m "$PWD")"
          cat > ci-settings.json <<EOF
          {
            "env": {
              "ANTHROPIC_BASE_URL": "http://127.0.0.1:${MOCK_PORT}",
              "ANTHROPIC_AUTH_TOKEN": "dummy-matrix",
              "ANTHROPIC_API_KEY": "dummy-matrix",
              "ANTHROPIC_MODEL": "claude-sonnet-4-5"
            },
            "hooks": {
              "PreToolUse": [
                { "matcher": "Bash|PowerShell",
                  "hooks": [{ "type": "command",
                    "command": "python ${ws}/script/hook_probe.py bash --agent claudecode --source ci --probe-dir ${ws}/.hook-probe",
                    "timeout": 30 }] }
              ],
              "PostToolUse": [
                { "matcher": "Bash|PowerShell",
                  "hooks": [{ "type": "command",
                    "command": "python ${ws}/script/hook_probe.py post --agent claudecode --source ci --probe-dir ${ws}/.hook-probe",
                    "timeout": 30 }] }
              ]
            }
          }
          EOF

      - name: Headless run (mock-driven turn)
        run: |
          DISABLE_GROWTHBOOK=1 claude -p "Run exactly: echo agent-matrix-smoke" \
            --settings ci-settings.json

      - name: Assert engine decision logged (positive sentinel)
        run: |
          lines=$(wc -l < .hook-probe/dump.jsonl)
          echo "probe dump lines: $lines"
          test "$lines" -ge 1
          grep -q 'tool_name' .hook-probe/dump.jsonl
          test -f .crush-tether/decisions.jsonl
          grep -q '"command":"echo mock-hook-test"' .crush-tether/decisions.jsonl
          grep -q '"decision":"allow"' .crush-tether/decisions.jsonl

      - name: Scenario suite (deny / fail-open / updated_input)
        run: |
          python script/mock_llm.py --port 8788 --cmd "echo mock-hook-test > ci-exec.txt" \
            --log scenario-requests.jsonl &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null "http://127.0.0.1:8788/"; then break; fi
            sleep 0.5
          done
          ws="$(cygpath -m "$PWD")"
          cat > ci-scenario-settings.json <<EOF
          {
            "env": {
              "ANTHROPIC_BASE_URL": "http://127.0.0.1:8788",
              "ANTHROPIC_AUTH_TOKEN": "dummy-matrix",
              "ANTHROPIC_API_KEY": "dummy-matrix",
              "ANTHROPIC_MODEL": "claude-sonnet-4-5"
            },
            "hooks": {
              "PreToolUse": [
                { "matcher": "Bash|PowerShell",
                  "hooks": [{ "type": "command",
                    "command": "python $ws/script/hook_probe.py perm --agent claudecode --source ci --probe-dir $ws/.hook-probe",
                    "timeout": 30 }] }
              ]
            }
          }
          EOF
          for s in deny failopen rewrite; do
            bash script/ci_scenario.sh setup "$s" "$ws/.hook-probe" claudecode "$ws"
            DISABLE_GROWTHBOOK=1 claude -p "Run exactly: echo agent-matrix-smoke" \
              --settings ci-scenario-settings.json
            bash script/ci_scenario.sh assert "$s" "$ws/.hook-probe" claudecode "$ws"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-code-probe-dump-windows
          path: |
            .hook-probe/dump.jsonl
            .crush-tether/decisions.jsonl
            mock-requests.jsonl
            scenario-requests.jsonl
          if-no-files-found: warn

  crush-windows:
    name: crush headless hook smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Resolve crush version
        id: ver
        run: |
          ver="${{ inputs.crush_version }}"
          if [ -z "$ver" ]; then ver="${CRUSH_VERSION_PINNED}"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ver=$(curl -fsSL https://api.github.com/repos/charmbracelet/crush/releases/latest \
              | grep -o '"tag_name": "v[^"]*"' | head -1 | cut -d'"' -f4 | sed 's/^v//')
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Install crush ${{ steps.ver.outputs.ver }}
        run: |
          v="${{ steps.ver.outputs.ver }}"
          curl -fsSL -o crush.zip \
            "https://github.com/charmbracelet/crush/releases/download/v${v}/crush_${v}_Windows_x86_64.zip"
          bindir="$(cygpath -m "$HOME")/bin"
          mkdir -p "$HOME/bin"
          7z x -y -o"$HOME/bin" crush.zip >/dev/null
          exe=$(find "$HOME/bin" -name crush.exe | head -1)
          test -n "$exe"
          # zip 资产带版本嵌套目录，crush.exe 归位到 PATH 根层
          [ "$(dirname "$exe")" = "$HOME/bin" ] || cp "$exe" "$HOME/bin/crush.exe"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Check crush on PATH
        run: crush --version

      - name: Wrapper guard unit check (cmd, M8.2)
        run: |
          cd plugin/crush-tether/bin
          # present: forward (check mode, empty stdin -> silent exit 0)
          cmd //c crush-tether-wrapper.cmd </dev/null
          # absent: PATH without cargo bin -> exit 2 + guidance (failure mode #2)
          set +e
          out=$(PATH="/c/Windows/System32:/c/Windows" cmd //c crush-tether-wrapper.cmd </dev/null 2>&1)
          code=$?
          set -e
          test "$code" -eq 2
          echo "$out" | grep -q "binary not found"

      - name: Install engine (crush-tether) to PATH
        run: cargo install --path . --locked

      - name: Start mock LLM backend
        run: |
          python script/mock_llm.py --log mock-requests.jsonl &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null "http://127.0.0.1:${MOCK_PORT}/"; then exit 0; fi
            sleep 0.5
          done
          exit 1

      - name: Register probe hooks via project crush.json
        run: |
          mkdir -p .hook-probe
          ws="$(cygpath -m "$PWD")"
          cat > crush.json <<EOF
          {
            "providers": {
              "mockspike": {
                "type": "openai-compat",
                "base_url": "http://127.0.0.1:${MOCK_PORT}/v1",
                "api_key": "dummy-matrix",
                "models": [{"id": "mock-model", "name": "Mock Matrix Model",
                            "context_window": 128000}]
              }
            },
            "hooks": {
              "PreToolUse": [
                { "name": "hook-probe",
                  "command": "python ${ws}/script/hook_probe.py bash --agent crush --source ci --probe-dir ${ws}/.hook-probe",
                  "timeout": 30 }
              ]
            }
          }
          EOF

      - name: Headless run (mock-driven turn)
        run: crush run -m mockspike/mock-model "agent-matrix smoke"

      - name: Assert engine decision logged (positive sentinel)
        run: |
          lines=$(wc -l < .hook-probe/dump.jsonl)
          echo "probe dump lines: $lines"
          test "$lines" -ge 1
          test -f .crush-tether/decisions.jsonl
          grep -q '"command":"echo mock-hook-test"' .crush-tether/decisions.jsonl
          grep -q '"decision":"allow"' .crush-tether/decisions.jsonl

      - name: Scenario suite (deny / fail-open / updated_input)
        run: |
          python script/mock_llm.py --port 8788 --cmd "echo mock-hook-test > ci-exec.txt" \
            --log scenario-requests.jsonl &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null "http://127.0.0.1:8788/"; then break; fi
            sleep 0.5
          done
          ws="$(cygpath -m "$PWD")"
          cat > crush.json <<EOF
          {
            "providers": {
              "mockspike": {
                "type": "openai-compat",
                "base_url": "http://127.0.0.1:8788/v1",
                "api_key": "dummy-matrix",
                "models": [{"id": "mock-model", "name": "Mock Matrix Model",
                            "context_window": 128000}]
              }
            },
            "hooks": {
              "PreToolUse": [
                { "name": "hook-probe",
                  "command": "python $ws/script/hook_probe.py perm --agent crush --source ci --probe-dir $ws/.hook-probe",
                  "timeout": 30 }
              ]
            }
          }
          EOF
          for s in deny failopen rewrite; do
            bash script/ci_scenario.sh setup "$s" "$ws/.hook-probe" crush "$ws"
            crush run -m mockspike/mock-model "agent-matrix scenario"
            bash script/ci_scenario.sh assert "$s" "$ws/.hook-probe" crush "$ws"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crush-probe-dump-windows
          path: |
            .hook-probe/dump.jsonl
            .crush-tether/decisions.jsonl
            mock-requests.jsonl
            scenario-requests.jsonl
          if-no-files-found: warn

  zcode-windows:
    name: zcode headless hook smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Resolve zcode version (extras bucket manifest)
        id: ver
        run: |
          spec="${{ inputs.zcode_version }}"
          if [ -z "$spec" ]; then spec="${ZCODE_VERSION_PINNED}"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$spec" = "latest" ]; then
            ver=$(curl -fsSL https://raw.githubusercontent.com/ScoopInstaller/Extras/master/bucket/zcode.json \
              | python -c "import json,sys; print(json.load(sys.stdin)['version'])")
          else
            ver="$spec"
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Download and extract zcode CLI bundle
        run: |
          v="${{ steps.ver.outputs.ver }}"
          cd "$(cygpath "$RUNNER_TEMP")"
          curl -fsSL -o zcode-installer.exe \
            "https://cdn-zcode.z.ai/zcode/electron/releases/${v}/windows-x64/ZCode-${v}-win-x64.exe"
          7z x -y zcode-installer.exe >/dev/null
          app7z=$(find '$PLUGINSDIR' -name 'app-*.7z' | head -1)
          test -n "$app7z"
          7z x -y "$app7z" >/dev/null
          cjs=$(find . -path '*resources/glm/zcode.cjs' | head -1)
          test -n "$cjs"
          echo "ZCODE_CJS=$(cygpath -m "$PWD/$cjs")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install engine (crush-tether) to PATH
        run: cargo install --path . --locked

      - name: Provision crush-tether plugin (unattended, plugin track)
        run: |
          python - <<'PYEOF'
          import json, os, shutil, uuid, time
          root = os.path.join(os.path.expanduser("~"), ".zcode", "cli", "plugins")
          repo_plugin = os.path.abspath("plugin")
          mkt = "crush-tether-marketplace"
          plug_id = "crush-tether@crush-tether-marketplace"
          ver = json.load(open(os.path.join(repo_plugin, "crush-tether", ".zcode-plugin",
                                            "plugin.json"), encoding="utf-8"))["version"]
          shutil.copytree(repo_plugin, os.path.join(root, "marketplaces", mkt))
          install_path = os.path.join(root, "cache", mkt, "crush-tether", ver)
          shutil.copytree(os.path.join(repo_plugin, "crush-tether"), install_path)
          now = time.strftime("%Y-%m-%dT%H:%M:%S.000Z", time.gmtime())
          json.dump({"version": 1, "marketplaces": [{
              "id": mkt, "source": {"source": "directory", "path": repo_plugin},
              "name": mkt, "addedAt": now, "lastUpdated": now,
              "pluginCount": 1, "cacheTransactionId": str(uuid.uuid4()),
          }]}, open(os.path.join(root, "known_marketplaces.json"), "w", encoding="utf-8"), indent=2)
          json.dump({"version": 1, "plugins": [{
              "id": plug_id, "name": "crush-tether", "marketplace": mkt,
              "version": ver, "installPath": install_path, "installedAt": now,
              "updatedAt": now, "scope": "user", "source": "./crush-tether",
              "cacheTransactionId": str(uuid.uuid4()),
          }]}, open(os.path.join(root, "installed_plugins.json"), "w", encoding="utf-8"), indent=2)
          print("provisioned:", plug_id, ver)
          PYEOF

      - name: Enable plugin and point model backend at mock
        run: |
          python - <<'PYEOF'
          import json, os
          p = os.path.join(os.path.expanduser("~"), ".zcode", "cli", "config.json")
          json.dump({
            "plugins": {"enabledPlugins": {"crush-tether@crush-tether-marketplace": True},
                        "options": {}},
            "provider": {"mockspike": {"kind": "anthropic", "name": "mockspike",
                                       "options": {"baseURL": "http://127.0.0.1:8787",
                                                   "apiKey": "dummy-matrix"}}},
            "model": {"main": "mockspike/mock-model"},
          }, open(p, "w", encoding="utf-8"), indent=2)
          print("cli config written")
          PYEOF

      - name: Verify plugin registration
        run: node "$ZCODE_CJS" plugins list | grep "crush-tether@crush-tether-marketplace"

      - name: Start mock LLM backend
        run: |
          python script/mock_llm.py --log mock-requests.jsonl &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null "http://127.0.0.1:${MOCK_PORT}/"; then exit 0; fi
            sleep 0.5
          done
          exit 1

      - name: Headless run (mock-driven turn)
        run: |
          node "$ZCODE_CJS" -p "Run exactly: echo agent-matrix-smoke"

      - name: Assert engine decision logged (positive sentinel)
        run: |
          test -f .crush-tether/decisions.jsonl
          grep -q '"command":"echo mock-hook-test"' .crush-tether/decisions.jsonl
          grep -q '"decision":"allow"' .crush-tether/decisions.jsonl

      - name: Scenario suite (deny / fail-open / updated_input)
        run: |
          python script/mock_llm.py --port 8788 --cmd "echo mock-hook-test > ci-exec.txt" \
            --log scenario-requests.jsonl &
          for i in $(seq 1 40); do
            if curl -s -o /dev/null "http://127.0.0.1:8788/"; then break; fi
            sleep 0.5
          done
          python - <<'PYEOF'
          import json, os, shutil, uuid, time, sys
          root = os.path.join(os.path.expanduser("~"), ".zcode", "cli")
          plugins_root = os.path.join(root, "plugins")
          ws = os.getcwd()
          mkt = "crush-tether-probe-marketplace"
          plug_id = "crush-tether-probe@crush-tether-probe-marketplace"
          # 探针插件 = 正式插件拷贝改写(hooks.json 换 perm 角色 + 工作区探针路径)。
          # command 必须用绝对路径解释器:zcode spawn hook 给精简 env,PATH 解析与
          # uv 类 wrapper 均不可靠(2026-09-11 本机实测,见 test-and-ci.md §2)。
          hooks = {"hooks": {"PreToolUse": [{"matcher": "Bash", "hooks": [{
              "type": "process", "command": sys.executable,
              "args": [os.path.join(ws, "script", "hook_probe.py"), "perm",
                       "--agent", "zcode", "--source", "ci",
                       "--probe-dir", os.path.join(ws, ".hook-probe")],
              "timeoutMs": 30000}]}]}}
          dst = os.path.join(os.environ["RUNNER_TEMP"], "probe-plugin", "crush-tether-probe")
          shutil.rmtree(os.path.dirname(dst), ignore_errors=True)
          shutil.copytree(os.path.abspath(os.path.join("plugin", "crush-tether")), dst)
          json.dump(hooks, open(os.path.join(dst, "hooks", "hooks.json"), "w", encoding="utf-8"), indent=2)
          pj = os.path.join(dst, ".zcode-plugin", "plugin.json")
          pjd = json.load(open(pj, encoding="utf-8"))
          pjd["name"] = "crush-tether-probe"
          json.dump(pjd, open(pj, "w", encoding="utf-8"), indent=2)
          json.dump({"name": mkt, "owner": "crush_tether",
                     "plugins": [{"name": "crush-tether-probe",
                                  "source": "./crush-tether-probe"}]},
                    open(os.path.join(os.path.dirname(dst), "marketplace.json"),
                         "w", encoding="utf-8"), indent=2)
          # 装配四件套切换到探针插件(机械重建,spike 验证无校验障碍)
          ver = pjd.get("version", "0.0.0")
          install_path = os.path.join(plugins_root, "cache", mkt, "crush-tether-probe", ver)
          shutil.rmtree(install_path, ignore_errors=True)
          shutil.copytree(dst, install_path)
          now = time.strftime("%Y-%m-%dT%H:%M:%S.000Z", time.gmtime())
          json.dump({"version": 1, "marketplaces": [{
              "id": mkt, "source": {"source": "directory", "path": os.path.dirname(dst)},
              "name": mkt, "addedAt": now, "lastUpdated": now,
              "pluginCount": 1, "cacheTransactionId": str(uuid.uuid4()),
          }]}, open(os.path.join(plugins_root, "known_marketplaces.json"), "w", encoding="utf-8"), indent=2)
          json.dump({"version": 1, "plugins": [{
              "id": plug_id, "name": "crush-tether-probe", "marketplace": mkt,
              "version": ver, "installPath": install_path, "installedAt": now,
              "updatedAt": now, "scope": "user", "source": "./crush-tether-probe",
              "cacheTransactionId": str(uuid.uuid4()),
          }]}, open(os.path.join(plugins_root, "installed_plugins.json"), "w", encoding="utf-8"), indent=2)
          cfg_path = os.path.join(root, "config.json")
          cfg = json.load(open(cfg_path, encoding="utf-8"))
          cfg["plugins"]["enabledPlugins"] = {plug_id: True}
          cfg["provider"]["mockspike"]["options"]["baseURL"] = "http://127.0.0.1:8788"
          json.dump(cfg, open(cfg_path, "w", encoding="utf-8"), indent=2)
          print("provisioned probe plugin:", plug_id)
          PYEOF
          ws="$(cygpath -m "$PWD")"
          for s in deny failopen rewrite; do
            bash script/ci_scenario.sh setup "$s" "$ws/.hook-probe" zcode "$ws"
            node "$ZCODE_CJS" -p "Run exactly: echo agent-matrix-smoke"
            bash script/ci_scenario.sh assert "$s" "$ws/.hook-probe" zcode "$ws"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zcode-decisions-windows
          path: |
            .crush-tether/decisions.jsonl
            .hook-probe/dump.jsonl
            mock-requests.jsonl
            scenario-requests.jsonl
          if-no-files-found: warn
