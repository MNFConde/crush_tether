[package]
name = "crush_tether"
version = "0.1.0"
edition = "2024"

[lib]
name = "crush_tether"
path = "src/lib.rs"

[[bin]]
name = "crush-tether"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
# internals：仅用其公开 AST 语法树（script_allow 加载期字面量提取，M4.0）；
# AST 结构随 rhai 版本可能变化，升级须 cargo test（机制 3 运行时双保险兜底）。
rhai = { version = "1", features = ["internals"] }
interprocess = "2"
notify = "8.2.0"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }

# serve detached spawn 前 清自身 stdio 句柄继承标志（Windows 专有，M4.1 修复）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# clippy 关键分配/性能 lint（nursery 组、默认不开，逐条显式提升为 deny）：
# 违例在本地 clippy 与 CI 同步红灯，不留到人工审查阶段。
[lints.clippy]
redundant_clone = "deny"
needless_collect = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
