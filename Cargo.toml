[package]
name = "crush_tether"
version = "0.1.0"
edition = "2024"

[lib]
name = "crush_tether"
path = "src/lib.rs"

[[bin]]
name = "crush-tether"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
# internals：仅用其公开 AST 语法树（script_allow 加载期字面量提取，M4.0）；
# AST 结构随 rhai 版本可能变化，升级须 cargo test（机制 3 运行时双保险兜底）。
rhai = { version = "1", features = ["internals"] }
interprocess = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
