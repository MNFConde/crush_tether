# knowledge.toml（main，随默认配置生成机制落盘）
version = 1

[npx]
may_write = true                 # 属性：下载并执行任意包

[npm]
sub.exec = { alias_of = "npx" }  # 联系：等价命令（运行时归一）
sub.x    = { alias_of = "npx" }

[pip3]
alias_of = "pip"

[curl]
may_write   = true
write_flags = ["-o", "--output"] # 属性：带这些 flag 会写文件

# 写目标位置（M7.0 写目标感知逃逸检查）：最后一个位置参数是写目标，
# 读源豁免——allow 放行这类命令时写内自动过、写外仍拦。
[cp]
write_position = "last"

[mv]
write_position = "last"

[touch]
write_position = "last"

[mkdir]
write_position = "last"

[git]
sub.branch     = { write_tokens = ["-d", "-D", "-m", "-M", "--delete", "--move", "--create"] }
sub.remote     = { write_tokens = ["add", "set-url", "remove", "rename", "set-head", "set-branches"] }
sub.tag        = { write_tokens = ["-d", "--delete", "-a", "-s", "-m", "-f", "-u", "--annotate"] }
sub.config     = { write_arg_count = 2 }   # 位置参数 ≥2 即写形态
flag."--force" = { same_flag = "-f" }      # 联系：flag 等价
flag."--hard"  = { irreversible = true }   # 属性：破坏性参数
# 前置全局选项带值（M9.1）：子命令探测跳值——`git -C <p> <sub>` 不再顶掉子命令槽
flag."-C"        = { takes_value = true }
flag."-c"        = { takes_value = true }
flag."--git-dir" = { takes_value = true }
flag."--work-tree" = { takes_value = true }

# 命令级不可恢复事实（M9.3 irreversible_gate 的数据源）：效果无法恢复的
# 命令，未收录而落 confirm 时升 deny；只记强断言（rm 等上下文依赖的不标）。
[parted]
irreversible = true

[fdisk]
irreversible = true

[sfdisk]
irreversible = true

[shred]
irreversible = true

[wipefs]
irreversible = true

[make]
delegates = "Makefile"            # 联系：委托执行项目内文件中的任意命令

[sudo]
wraps = "*"                       # 联系：包装壳（v1 仅登记）

# 危险 flag/写形态事实（M10.2，Kode-CLI 权限审查引入）：默认包不含这两
# bin（落 default confirm 兜底）——登记供项目自放开时 lint 提示与精确拦截。
# jq 程序串内 system() 可执行任意命令：TOML 无参数内容槽位，引擎不拦；
# 下列 flag 读任意文件/注入变量，按带值登记（子命令探测跳值、lint 消费）。
[jq]
flag."--from-file"   = { same_flag = "-f" }
flag."-f"            = { takes_value = true }
flag."--library-path" = { same_flag = "-L" }
flag."-L"            = { takes_value = true }
flag."--arg"         = { takes_value = true }
flag."--argjson"     = { takes_value = true }
flag."--rawfile"     = { takes_value = true }
flag."--slurpfile"   = { takes_value = true }
flag."--indent"      = { takes_value = true }

# sed -i 原地写（GNU 后缀随 -i 粘连，不入 takes_value；BSD 分离形态保守不登记）。
[sed]
write_flags = ["-i", "--in-place"]
